name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate release identity and notes
        run: node scripts/release-notes.mjs "$RELEASE_TAG"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:cli
      - run: pnpm package
      - name: Checksums
        run: shasum -a 256 mascot-*.vsix > SHA256SUMS
        working-directory: artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; retaining its assets.'
          else
            args=(--title "Mascot $RELEASE_TAG" --notes-file release-notes.md --verify-tag)
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" artifacts/*.vsix artifacts/SHA256SUMS "${args[@]}"
          fi
      - name: Publish stable version to Open VSX
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          test -n "${OVSX_PAT:-}" || { echo '::error::Add the OVSX_PAT repository secret to enable Open VSX publishing.'; exit 1; }
          pnpm dlx ovsx@1.2.0 publish --packagePath artifacts/*.vsix --skip-duplicate
